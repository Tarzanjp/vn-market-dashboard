# Manual-only: (re)populate public/data/history/<year>.jsonl from free historical
# sources (US Treasury yield CSVs, Yahoo Finance for DXY). Safe to re-run — it
# upserts by date, same as the daily pipeline's append_history() step. Never runs
# on a schedule; trigger it by hand when extending the backfill range or if the
# history files ever need rebuilding. See automation/README.md.
name: Backfill historical data

on:
  workflow_dispatch:
    inputs:
      years:
        description: "How many years back to backfill"
        required: false
        default: "2"

permissions:
  contents: write
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backfill
        run: python automation/backfill_history.py --years "${{ github.event.inputs.years }}"

      - name: Commit & push history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: backfill historical data (manual)"
          file_pattern: "public/data/history/*.jsonl public/data/history/index.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # Pipeline hỏng mà không ai biết là cách một hệ thống "đúng" trở thành sai
      # trên thực tế: trang vẫn hiện số cũ với as-of cũ, hoàn toàn trung thực, và
      # không có gì leo thang. Trước bước này, không workflow nào có một dòng
      # `if: failure()` — hỏng là im lặng.
      #
      # Mở issue thay vì gửi mail: nó nằm ngay trong repo, và tìm-hay-tạo tránh
      # đẻ ra hàng chục issue giống nhau khi hỏng nhiều ngày liên tiếp.
      - name: Báo hỏng bằng issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `pipeline hỏng: ${context.workflow}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Workflow **${context.workflow}** thất bại lúc ${new Date().toISOString()}.`,
              ``,
              `Log: ${url}`,
              ``,
              `Trong lúc chưa sửa, trang vẫn hiển thị dữ liệu của phiên gần nhất lấy được`,
              `— số đúng, nhưng cũ. Nhãn as-of trên trang cho biết cũ tới đâu.`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "pipeline",
            });
            const hit = open.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["pipeline"],
              });
            }
