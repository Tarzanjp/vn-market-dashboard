# Build the Vite app and deploy the static output to the gh-pages branch
# (kept as a separate branch/deploy from main to avoid Jekyll vs Actions 404s — see automation/README.md).
name: Build and deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      # Pipeline hỏng mà không ai biết là cách một hệ thống "đúng" trở thành sai
      # trên thực tế: trang vẫn hiện số cũ với as-of cũ, hoàn toàn trung thực, và
      # không có gì leo thang. Trước bước này, không workflow nào có một dòng
      # `if: failure()` — hỏng là im lặng.
      #
      # Mở issue thay vì gửi mail: nó nằm ngay trong repo, và tìm-hay-tạo tránh
      # đẻ ra hàng chục issue giống nhau khi hỏng nhiều ngày liên tiếp.
      - name: Báo hỏng bằng issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `pipeline hỏng: ${context.workflow}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Workflow **${context.workflow}** thất bại lúc ${new Date().toISOString()}.`,
              ``,
              `Log: ${url}`,
              ``,
              `Trong lúc chưa sửa, trang vẫn hiển thị dữ liệu của phiên gần nhất lấy được`,
              `— số đúng, nhưng cũ. Nhãn as-of trên trang cho biết cũ tới đâu.`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "pipeline",
            });
            const hit = open.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["pipeline"],
              });
            }
