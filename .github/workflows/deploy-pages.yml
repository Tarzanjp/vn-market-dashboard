# Deploy tĩnh ổn định → nhánh gh-pages (tránh xung đột Jekyll / 404)
name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public folder (chỉ file cần serve)
        run: |
          rm -rf public
          mkdir -p public/data
          cp index.html the-gioi.html public/
          # data live (bắt buộc cho dashboard)
          cp -f data/live.js public/data/ 2>/dev/null || echo 'window.__MARKET_LIVE=null;' > public/data/live.js
          cp -f data/snapshot-latest.json public/data/ 2>/dev/null || true
          # không publish script/docs/.github
          touch public/.nojekyll
          ls -la public public/data

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
