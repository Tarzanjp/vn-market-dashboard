# Primary data pipeline: free APIs + optional Grok (XAI_API_KEY) → public/data/live.json
# This is the system of record for daily data. The local agent (automation/run_agent_daily.ps1)
# is a manual/backup tool only — it never pushes to main directly, it opens a PR instead.
name: Daily market data update

on:
  schedule:
    # Sau phiên VN ~16:00 ICT = 09:00 UTC (T2–T6)
    - cron: "0 9 * * 1-5"
    # Morning pack ~08:15 ICT = 01:15 UTC (T2–T6)
    - cron: "15 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch APIs + optional Grok auto-fill
        env:
          # Thêm secret XAI_API_KEY trong repo Settings → Secrets → Actions
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # optional repo variable XAI_MODEL; default grok-3-latest in script
          XAI_MODEL: ${{ vars.XAI_MODEL }}
        run: python automation/daily_update.py

      - name: Commit & push snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: daily market snapshot (auto)"
          file_pattern: >-
            public/data/live.json
            public/data/last-run.json
            public/data/grok-fill.json
            public/data/history/*.jsonl
            public/data/history/index.json
            public/data/news-raw.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
