# Dòng tiền & Cashout (VN) — fetch riêng vì cần vnstock (+pandas), tách khỏi
# data-update.yml (cố tình chỉ dùng thư viện chuẩn, xem automation/README.md).
#
# LƯU Ý: push của git-auto-commit-action dùng GITHUB_TOKEN mặc định — GitHub
# CỐ TÌNH không cho push bằng GITHUB_TOKEN tự kích hoạt workflow khác (chặn
# vòng lặp đệ quy), nên nó KHÔNG tự gọi deploy.yml dù deploy.yml có
# `on: push: branches: [main]`. Vì vậy bước cuối phải chủ động gọi
# `workflow_dispatch` cho deploy.yml — nếu thiếu bước này, cashout-vn.json
# được cập nhật trong repo nhưng trang thật trên GitHub Pages vẫn đứng yên
# (đã kiểm chứng trực tiếp: gh-pages không đổi sau lần chạy đầu không có bước này).
name: Cashout VN data update

on:
  schedule:
    # Ngay sau khi HOSE đóng cửa: 15:00 ICT = 17:00 JST = 08:00 UTC (T2–T6)
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # cần để gọi workflow_dispatch cho deploy.yml ở bước cuối

concurrency:
  group: cashout-vn-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r automation/vn_cashout/requirements.txt

      - name: Fetch cashout snapshot (VCI via vnstock)
        run: python automation/vn_cashout/fetch_cashout_data.py

      - name: Commit & push snapshot
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: cashout VN snapshot (auto)"
          file_pattern: public/data/cashout-vn.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Trigger Pages redeploy
        if: steps.autocommit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
